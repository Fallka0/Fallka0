<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="GitHub stats for Fallka0">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #59636e; letter-spacing: .08em; }
    .num { font-size: 28px; font-weight: 700; fill: #1f2328; }
    .lbl { font-size: 14px; fill: #59636e; }
    .leg { font-size: 13px; fill: #1f2328; }
    .pct { font-size: 13px; fill: #59636e; font-variant-numeric: tabular-nums; }
    .fade { opacity: 0; animation: fade .6s ease forwards; }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .fade, .grow { animation: none; opacity: 1; transform: none; } }
  </style>
